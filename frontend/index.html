<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Force HTTPS for all outgoing requests and assets -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <script>
      if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1' && !location.hostname.endsWith('.local')) {
        location.replace('https:' + location.href.substring(location.protocol.length));
      }
    </script>

    <!-- Primary Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />

    <!-- SEO & Metadata -->
    <title>Smart Campus Service Management System | Enterprise Portal</title>
    <meta name="description" content="Smart Campus Service Management System (SCMS) - Enterprise operations platform delivering automated ticket triage, queue-based dispatch, SLA compliance tracking, and requester feedback for campus facilities and IT." />
    <meta name="keywords" content="Smart Campus, SCMS, Service Management, University Operations, Facilities, IT Helpdesk, SLA Tracking, Ticket Management" />
    <meta name="author" content="Smart Campus Systems" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Smart Campus Service Management System | Enterprise Portal" />
    <meta property="og:description" content="Centralized campus service desk, automated incident routing, real-time SLA tracking, and resolution analytics." />
    <meta property="og:site_name" content="Smart Campus Service Management System" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Smart Campus Service Management System" />
    <meta name="twitter:description" content="Enterprise operations platform delivering automated ticket triage, queue-based dispatch, and SLA compliance." />

    <!-- Preconnect Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased overflow-x-hidden w-full">
    <div id="root" class="w-full overflow-x-hidden min-h-screen"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
