<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Smart Campus Service Management System</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      body { background-color: #f8fafc; color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; }
      .card { background: white; max-width: 520px; width: 100%; border-radius: 1.5rem; padding: 2.5rem; border: 1px solid #e2e8f0; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05); text-align: center; }
      .badge { display: inline-block; background: #fee2e2; color: #b91c1c; font-weight: 800; font-size: 0.75rem; padding: 0.25rem 0.75rem; border-radius: 9999px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; }
      h1 { font-size: 1.75rem; font-weight: 800; color: #0f172a; margin-bottom: 0.5rem; }
      p { font-size: 0.875rem; color: #64748b; line-height: 1.6; margin-bottom: 1.5rem; }
      .btn { display: inline-block; background: #2563eb; color: white; text-decoration: none; font-weight: 700; font-size: 0.875rem; padding: 0.625rem 1.25rem; border-radius: 0.75rem; transition: background 0.2s; }
      .btn:hover { background: #1d4ed8; }
      .footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #f1f5f9; font-size: 0.75rem; color: #94a3b8; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">404 Error</div>
      <h1>Page Not Found</h1>
      <p>The campus resource or service page you requested could not be located. Click below to return to the Smart Campus operations portal.</p>
      <a href="/" class="btn">Return to Smart Campus Portal</a>
      <div class="footer">Smart Campus Operations & Service Management System</div>
    </div>
  </body>
</html>
