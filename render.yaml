services:
  # FastAPI Backend Web Service
  - type: web
    name: smartcampus-backend
    runtime: python
    autoDeploy: true
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard: mongodb+srv://<user>:<password>@<cluster>.mongodb.net/?retryWrites=true&w=majority
      - key: MONGODB_DB_NAME
        value: smartcampus_db
      - key: SECRET_KEY
        generateValue: true
      - key: SLA_HOURS_HIGH
        value: 24
      - key: SLA_HOURS_MEDIUM
        value: 72
      - key: SLA_HOURS_LOW
        value: 120
      - key: CORS_ORIGINS
        value: "*"
      - key: SALESFORCE_ENABLED
        value: "true"
      - key: SALESFORCE_MOCK_MODE
        value: "false"
      - key: SALESFORCE_AUTH_TYPE
        value: "client_credentials"
      - key: SALESFORCE_LOGIN_URL
        value: "https://login.salesforce.com"
      - key: SALESFORCE_INSTANCE_URL
        sync: false # Set in Render Dashboard: e.g. https://your-domain.my.salesforce.com
      - key: SALESFORCE_CLIENT_ID
        sync: false # Set in Render Dashboard: Connected App Consumer Key
      - key: SALESFORCE_CLIENT_SECRET
        sync: false # Set in Render Dashboard: Connected App Consumer Secret

  # React Single Page Application Frontend
  - type: web
    name: smartcampus-frontend
    runtime: static
    autoDeploy: true
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

